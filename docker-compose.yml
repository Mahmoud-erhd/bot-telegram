version: "3.8"

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m-automation-store-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      M_AUTOMATION_DB_PATH: /data/store.db
    volumes:
      - bot_data:/data

volumes:
  bot_data:
    driver: local
